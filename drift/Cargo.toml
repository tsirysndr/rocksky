[workspace]

[package]
name = "drift"
version = "0.1.0"
authors = ["Tsiry Sandratraina <tsiry.sndr@rocksky.app"]
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/tsirysndr/rocksky"

[dependencies]
actix-web = "4.11"
clap = { version = "4.5", features = ["derive", "env"] }
# `parquet` and `json` are linked in rather than autoloaded: an autoloading
# DuckDB reaches out to extensions.duckdb.org on first use, and drift must work
# on a box with no egress. Both imply `bundled`. Same pin as riff so the two
# services carry one DuckDB build.
duckdb = { version = "1.10505.0", features = ["bundled", "parquet", "json", "r2d2"] }
env_logger = "0.11"
log = "0.4"
postgres = "0.19"
r2d2 = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
