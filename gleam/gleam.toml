name = "rocksky_api"
version = "0.0.1"
target = "javascript"

description = "Rocksky API — REST (Hono) and XRPC (@atproto/xrpc-server) services, ported to Gleam on Node.js"
licences = ["MIT"]

[javascript]
runtime = "nodejs"
typescript_declarations = false

[dependencies]
gleam_stdlib = ">= 0.71.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_time = ">= 1.0.0 and < 2.0.0"
gleam_regexp = ">= 1.0.0 and < 2.0.0"
simplifile = ">= 2.0.0 and < 3.0.0"
envoy = ">= 1.0.0 and < 2.0.0"
filepath = ">= 1.0.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.2.0 and < 2.0.0"
