[package]
name = "rocksky-jellyfin"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The library data layer — the Postgres projections over `user_uploads` and the
# catalogue, S3/BYO URL resolution, Typesense search and the ATProto side
# effects — is identical for both compat surfaces and lives in the Subsonic
# crate. Only the HTTP shape differs, so this crate re-uses it rather than
# keeping a second copy of the SQL in sync.
rocksky-navidrome = { path = "../navidrome" }

actix-cors = "0.7.1"
actix-web = "4.9.0"
anyhow = "1.0.96"
async-nats = "0.39"
chrono = { version = "= 0.4.39", features = ["serde"] }
dotenv = "0.15.0"
futures = "0.3"
hex = "0.4.3"
owo-colors = "4.1.0"
rand = "0.8.5"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.139"
serde_urlencoded = "0.7"
sha2 = "0.10"
sqlx = { version = "0.8.3", features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "chrono",
  "derive",
  "macros",
] }
tokio = { version = "1.43.0", features = ["full"] }
tracing = "0.1.41"

[dev-dependencies]
actix-web = "4.9.0"
rand = "0.8.5"
serde_json = "1.0.139"
sqlx = { version = "0.8.3", features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "chrono",
  "derive",
  "macros",
] }
tokio = { version = "1.43.0", features = ["full"] }
