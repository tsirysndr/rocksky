[package]
name = "rocksky-mock-pds"
version = "0.1.0"
description = "An in-memory ATProto PDS for tests: identity, sessions, repo writes, CAR sync and OAuth"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
actix-web = "4.11.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The OAuth endpoints read form bodies and query strings.
serde_urlencoded = "0.7"

# The CAR that `com.atproto.sync.getRepo` returns is built for real, so a
# consumer's parser and MST walk are genuinely exercised rather than stubbed.
serde_ipld_dagcbor = "0.6"
ipld-core = "0.4"
cid = "0.11"
unsigned-varint = "0.8"
sha2 = "0.10"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# The sync test decodes the archive it is served, rather than trusting it.
serde_ipld_dagcbor = "0.6"
ipld-core = "0.4"
cid = "0.11"
unsigned-varint = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
