# A complete self-hosted Rocksky.
#
#   docker compose -f crates/appview/docker-compose.yml up --build
#
# Then open http://localhost:3004 and sign in with your ATProto handle.
#
# The appview image builds from source — the web UI with bun, then the binary
# with cargo, then a slim runtime. The first build compiles the whole
# dependency graph and takes a while; after that the cache mounts in
# `Dockerfile` make a rebuild quick.
#
# Nothing here needs configuring first. The appview creates its SQLite
# databases, its signing key and a starter `config.toml` in the `data` volume on
# first boot, and creates the search collections in Typesense.
#
# # What is required, and why
#
# | service      | required | what breaks without it                                  |
# |--------------|----------|---------------------------------------------------------|
# | appview      | —        | —                                                       |
# | nats         | yes      | the mirrors, the Spotify poller, the playlist importer  |
# | typesense    | yes      | the search box and the search over your own uploads     |
# | tap          | no       | the database stops filling — no new scrobbles arrive    |
# | feeds        | no       | the genre feeds; the rest of the instance is unaffected |
# | redis        | no       | nothing; the cache falls back to an in-process map      |
# | navidrome    | no       | your library in Subsonic clients                        |
# | jellyfin     | no       | your library in Jellyfin clients                        |
# | spotify      | no       | nothing yet; off by default, see the service comment    |
# | mirror       | no       | scrobbles mirrored from Last.fm, ListenBrainz, Teal.fm  |
# | scrobbler    | no       | the Last.fm-compatible endpoint desktop clients use     |
# | webscrobbler | no       | scrobbles from the Web Scrobbler browser extension      |
#
# NATS and Typesense are *required*, and the appview refuses to start without
# them rather than running in a state where half the system silently does
# nothing. Redis is the only genuine accelerator here: without it the response
# cache is per-process, which is correct for one instance and only matters if
# you run several behind one hostname.
#
# `tap` is how the database fills. It is not *required* — the instance runs
# without it and answers from whatever is already stored — but a new instance
# with no Tap and no `--backfill` has nothing to show.
#
# # One database, shared by path
#
# With no `XATA_POSTGRES_URL` set, every service here opens the *same SQLite
# file* in the `data` volume, in WAL mode, so readers do not block the writer.
# That is why each of them mounts `data:/data` and sets `ROCKSKY_DATA_DIR` to
# the same place: a SQLite database is a path, not an address, so "the same
# database" means the same file.
#
# A service given its own volume, or a different `ROCKSKY_DATA_DIR`, creates an
# empty database and reports an empty library — with no error to say so. If a
# service starts up healthy and shows nothing, that is the first thing to
# check; each one logs which database it opened at startup.
#
# Set `XATA_POSTGRES_URL` and they all use that instead, and the volume stops
# mattering.
#
# # The secrets are shared the same way
#
# The volume matters even on Postgres, because the services also have to agree
# on a signing key. The appview generates its own `JWT_SECRET` into the data
# directory on first boot, and `navidrome` and `jellyfin` sign a token with it
# for every play they publish. With a different key the appview answers 401, so
# the library works in your client and nothing you play is ever scrobbled.
#
# (Logging in to Subsonic is not affected: that checks the password against
# your API keys in the database.)
#
# So the keys live beside the database, generated once and read by whoever
# starts next: `jwt.secret`, `storage.key`, `spotify.key`, `spotify.iv`. None of
# them is set in this file on purpose. A default here would be a signing key
# published in a public repository, which anyone could use to mint a token for
# any account on any instance that had not changed it.
#
# Set `JWT_SECRET` yourself and *every* service needs the same value, including
# the appview. Easier to leave it alone and let the volume do it.
#
# # Going public
#
# Two things change when this is reachable from the internet:
#
#   1. Set `ROCKSKY_DOMAIN` and `ROCKSKY_PUBLIC_URL`. The appview then registers
#      itself as a *confidential* OAuth client, serving its own client metadata
#      and JWKS — which is what lets sessions outlive the loopback flow.
#   2. Set `TYPESENSE_API_KEY` to something of your own and pass the same value
#      to the `typesense` service. The default is fine on a private network,
#      where the index holds nothing the public API does not already serve, and
#      not fine when the port is exposed.
#
# Put a TLS terminator in front; this listens on plain HTTP by design.

name: rocksky

# The six music services below are one binary — `rockskyd <service>` — so they
# share one image and one build. Anchors rather than six copies of the same
# twelve lines; a service overrides what it needs.
x-rockskyd: &rockskyd
  build:
    context: ../..
    dockerfile: crates/rockskyd/Dockerfile
  # The same tag on all six, so the image is built once and reused.
  image: rocksky-services:local
  restart: unless-stopped
  volumes:
    # The appview's volume: the shared SQLite database *and* the shared
    # secrets. See the note on the appview service — a service given its own
    # volume reports an empty library, and signs its scrobbles with a key the
    # appview does not accept.
    - data:/data
  depends_on:
    nats:
      condition: service_started
    appview:
      condition: service_started

# What every one of them reads.
x-rockskyd-env: &rockskyd-env
  # Blank means "join the appview's SQLite file through the volume below".
  # Set it — here or in `.env` — and all of them use that Postgres instead.
  XATA_POSTGRES_URL: ${XATA_POSTGRES_URL:-}
  ROCKSKY_DATA_DIR: /data

  NATS_URL: nats://nats:4222
  REDIS_URL: redis://redis:6379

  # Deliberately *not* set: JWT_SECRET, STORAGE_ENCRYPTION_KEY,
  # SPOTIFY_ENCRYPTION_KEY and SPOTIFY_ENCRYPTION_IV. They are read from the
  # data directory, generated on first boot and shared by path — see
  # `rocksky_db::keys`. A default here would be a publicly known signing key,
  # and setting one would also override the random key the appview generated.

  RUST_LOG: ${RUST_LOG:-info,sqlx=warn}

services:
  appview:
    build:
      context: ../..
      dockerfile: crates/appview/Dockerfile
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      # Inside the compose network, so the host's own ports stay free.
      NATS_URL: nats://nats:4222
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-rocksky}
      REDIS_URL: redis://redis:6379

      # Tap, which streams in the records. `enabled` follows from the hostname
      # being set; the admin password is only needed to register extra
      # repositories from here, which TAP_SIGNAL_COLLECTION below already
      # does by itself.
      TAP_HOSTNAME: tap:2480
      TAP_ADMIN_PASSWORD: ${TAP_ADMIN_PASSWORD:-rocksky}

      # Uncomment both to run this on a real domain. Until then the OAuth
      # client is the loopback one, which works but only for localhost.
      # ROCKSKY_DOMAIN: rocksky.example.com
      # ROCKSKY_PUBLIC_URL: https://rocksky.example.com

      # Repositories to populate from on first boot, comma-separated. Safe to
      # leave set: the projection is keyed on content hashes, so re-running it
      # updates rows rather than duplicating them.
      # ROCKSKY_BACKFILL_DIDS: did:plc:…
      # ROCKSKY_BACKFILL_ON_START: "true"

      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
    volumes:
      # The databases, the JWT signing key and config.toml. Losing this logs
      # every user out — the OAuth sessions are in it.
      - data:/data
    depends_on:
      nats:
        condition: service_started
      typesense:
        condition: service_healthy
      redis:
        condition: service_started
      # Not `service_healthy`: the appview reconnects to Tap on its own, so it
      # may start first and pick the stream up when Tap is ready.
      tap:
        condition: service_started

  # Required. The other services subscribe to `rocksky.*` here and do work in
  # response — see `crates/appview/src/events.rs` for the subjects.
  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["--jetstream", "--store_dir", "/data"]
    volumes:
      - nats:/data

  # Required. Serves the search box and the search over your own uploads.
  typesense:
    image: typesense/typesense:27.1
    restart: unless-stopped
    command:
      - "--data-dir=/data"
      - "--api-key=${TYPESENSE_API_KEY:-rocksky}"
      - "--enable-cors"
    volumes:
      - typesense:/data
    healthcheck:
      # The appview creates its collections at boot, so it has to wait for a
      # Typesense that is actually answering rather than one that has merely
      # started.
      #
      # Written with bash's `/dev/tcp` because this image ships no curl, no
      # wget and no nc — a `curl` healthcheck here would never pass, and the
      # appview would wait for a dependency that is already up.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8108 &&
          printf 'GET /health HTTP/1.0\r\n\r\n' >&3 &&
          grep -q '"ok":true' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      # The important one on an instance with a real catalogue.
      #
      # `/health` answers `{"ok":false}` while Typesense's write queue is
      # longer than its own healthy-lag thresholds — logging
      # `N queued writes > healthy write lag of 500`. That happens after a
      # large index build, and on the next start it replays that queue, which
      # takes minutes on hundreds of thousands of documents. It is recovering,
      # not broken.
      #
      # Without a start period the default patience is `interval * retries`,
      # and anything short of the replay time means Compose declares Typesense
      # dead and refuses to start the appview at all:
      #
      #   dependency failed to start: container …-typesense-1 is unhealthy
      #
      # Failures inside the start period do not count towards `retries`, so
      # this waits out a long replay while still failing reasonably fast once
      # the server is up and answering.
      start_period: 15m

  # How the database fills: a verified, filtered, backfilling firehose
  # consumer. https://github.com/bluesky-social/indigo/tree/main/cmd/tap
  #
  # Tap does the work that would otherwise have to live in this repository —
  # MST verification, signature checking, cursor persistence and per-repo
  # backfill — and hands the appview plain JSON records.
  tap:
    image: ghcr.io/bluesky-social/indigo/tap:latest
    restart: unless-stopped
    environment:
      TAP_BIND: ":2480"
      TAP_DATABASE_URL: sqlite:///data/tap.db

      # Only Rocksky records reach the appview. Without this, every consumer
      # receives the whole network's firehose and discards almost all of it;
      # the filter is applied inside Tap, so those records are never streamed.
      # Wildcards match at period boundaries.
      TAP_COLLECTION_FILTERS: app.rocksky.*

      # This is the backfill. Tap enumerates every repository in the network
      # holding at least one record of this collection and syncs it, so a new
      # instance discovers Rocksky users by itself instead of needing a list
      # of DIDs.
      #
      # `app.rocksky.scrobble` because anyone who has used Rocksky has
      # scrobbled; an account with a playlist and no scrobbles is not worth a
      # broader scan.
      TAP_SIGNAL_COLLECTION: app.rocksky.scrobble

      # With this set, every endpoint needs HTTP basic auth as `admin`.
      TAP_ADMIN_PASSWORD: ${TAP_ADMIN_PASSWORD:-rocksky}

      TAP_RELAY_URL: ${TAP_RELAY_URL:-https://relay1.us-east.bsky.network}
      TAP_LOG_LEVEL: ${TAP_LOG_LEVEL:-info}
    volumes:
      # The cursor and the tracked-repo list. Losing it re-backfills the
      # network — which works, but is hours of needless traffic.
      - tap:/data

  # The ATProto feed generator: the genre feeds, over the same database.
  #
  # Reads only and tolerates lag, so it is safe to point at a replica.
  feeds:
    build:
      context: ../..
      dockerfile: crates/feeds/Dockerfile
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      # The same database the appview writes. Set this to point both at a
      # Postgres; leave it blank and the service joins the appview's SQLite
      # file through the shared `data` volume below.
      XATA_POSTGRES_URL: ${XATA_POSTGRES_URL:-}

      # Where that file is. Has to match the appview's, since a SQLite
      # database is a path rather than an address — see the volume note.
      ROCKSKY_DATA_DIR: /data

      # The did:web is derived from this, so it must be the public hostname.
      ROCKSKY_FEEDGEN_DOMAIN: ${ROCKSKY_FEEDGEN_DOMAIN:-localhost}
      ROCKSKY_FEEDGEN_PORT: "8002"

      # Whose repository holds the app.rocksky.feed.generator records.
      # Defaults to the rocksky.app account, which is right for a mirror and
      # wrong for anyone publishing their own feeds.
      ROCKSKY_FEEDGEN_PUBLISHER_DID: ${ROCKSKY_FEEDGEN_PUBLISHER_DID:-}

      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
    volumes:
      # The *same* volume the appview mounts, which is what makes the SQLite
      # fallback work across containers: the file is shared, in WAL mode, so
      # this reads while the appview writes.
      #
      # A service given its own volume would quietly create an empty database
      # and report an empty library — no error, just no feeds. That is the one
      # way to get this wrong.
      - data:/data
    depends_on:
      # Only for the file to exist and carry the schema; this service reads.
      appview:
        condition: service_started

  # ----------------------------------------------------------- the music services
  #
  # All optional, and all off the same image. None of them is needed for the
  # web UI to work; each adds one way of getting music in or out.
  #
  # | service      | what it gives you                                         |
  # |--------------|-----------------------------------------------------------|
  # | navidrome    | your library in any Subsonic client                       |
  # | jellyfin     | your library in any Jellyfin client                       |
  # | mirror       | scrobbles mirrored from Last.fm, ListenBrainz and Teal.fm |
  # | scrobbler    | the Last.fm-compatible scrobble API, for desktop clients  |
  # | webscrobbler | scrobbles from the Web Scrobbler browser extension        |
  # | spotify      | nothing here yet — see the commented-out service below    |
  #
  # Comment out what you do not use: each is a process and a database
  # connection, and the mirror wakes up on a timer whether or not any account
  # has given it credentials.

  # Your library in any Subsonic client — play:Sub, Symfonium, Substreamer,
  # Sonixd. Log in with your Rocksky handle and an API key from /access-tokens.
  navidrome:
    <<: *rockskyd
    command: ["navidrome"]
    ports:
      - "4533:4533"
    environment:
      <<: *rockskyd-env
      # Without this it listens on 127.0.0.1 *inside the container*, which no
      # client can reach — the port is published and nothing answers.
      NAVIDROME_HOST: 0.0.0.0
      NAVIDROME_PORT: "4533"

      # Where to send a play and a star. Left unset it posts to
      # api.rocksky.app, which would scrobble your self-hosted plays to the
      # hosted instance — with a token that instance does not accept.
      #
      # Scrobbles land. Starring does not yet: the appview serves
      # `app.rocksky.scrobble.createScrobble` but not the `/likes` REST route
      # this uses, so a star from a Subsonic client 404s for now.
      ROCKSKY_API_URL: http://appview:3004

      # Search inside the Subsonic API. Optional — without it, search falls
      # back to the database, which is slower but correct.
      TYPESENSE_PROTOCOL: http
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: "8108"
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-rocksky}

  # The same library, for Jellyfin clients (Finamp, Feishin, the Jellyfin apps).
  jellyfin:
    <<: *rockskyd
    command: ["jellyfin"]
    ports:
      - "8096:8096"
    environment:
      <<: *rockskyd-env
      JELLYFIN_HOST: 0.0.0.0
      JELLYFIN_PORT: "8096"
      # What clients show in their server list.
      JELLYFIN_SERVER_NAME: ${JELLYFIN_SERVER_NAME:-Rocksky}

  # Polls Spotify for accounts that have connected it, and scrobbles what they
  # played. No port: it polls rather than serving.
  #
  # Commented out, because on a self-hosted instance it has nothing to poll.
  # The appview does not serve the Spotify OAuth connect flow yet — see the
  # header of `crates/appview/src/xrpc/app_rocksky/spotify.rs` — so no
  # `spotify_tokens` row is ever written here, and the poller finds no accounts.
  #
  # It is useful in one case: a database imported from the hosted instance,
  # where those rows already exist. Those tokens were encrypted with the hosted
  # deployment's `SPOTIFY_ENCRYPTION_KEY` and IV, so uncomment this *and*
  # supply that exact pair — the generated ones in the data directory cannot
  # decrypt somebody else's ciphertext.
  # spotify:
  #   <<: *rockskyd
  #   command: ["spotify"]
  #   environment:
  #     <<: *rockskyd-env
  #     SPOTIFY_ENCRYPTION_KEY: ${SPOTIFY_ENCRYPTION_KEY:?the hosted key is required}
  #     SPOTIFY_ENCRYPTION_IV: ${SPOTIFY_ENCRYPTION_IV:?the hosted IV is required}
  #     # Point at a proxy of your own to go through `spotify/`; the default is
  #     # api.spotify.com.
  #     SPOTIFY_API_URL: ${SPOTIFY_API_URL:-}

  # Mirrors plays from Last.fm, ListenBrainz and Teal.fm into Rocksky, for
  # accounts that have given it credentials. Also no port.
  mirror:
    <<: *rockskyd
    command: ["mirror"]
    environment:
      <<: *rockskyd-env
      # Same reason as navidrome's: without it the mirrored scrobbles are
      # posted to the hosted instance rather than this one.
      ROCKSKY_API: http://appview:3004
      # Teal.fm arrives over the firehose rather than an API.
      JETSTREAM_SERVER: ${JETSTREAM_SERVER:-}
      SPOTIFY_API_URL: ${SPOTIFY_API_URL:-}
      DEEZER_URL: ${DEEZER_URL:-}

  # The Last.fm-compatible scrobble API: what the desktop app, `rocksky` CLI
  # and any AudioScrobbler client post to.
  scrobbler:
    <<: *rockskyd
    command: ["scrobbler"]
    ports:
      - "7882:7882"
    environment:
      <<: *rockskyd-env
      SCROBBLE_HOST: 0.0.0.0
      SCROBBLE_PORT: "7882"
      SPOTIFY_API_URL: ${SPOTIFY_API_URL:-}
      DEEZER_URL: ${DEEZER_URL:-}

  # Scrobbles from the Web Scrobbler browser extension — YouTube, Bandcamp,
  # SoundCloud and the rest. Point the extension's webhook at this port.
  webscrobbler:
    <<: *rockskyd
    command: ["webscrobbler"]
    ports:
      - "7883:7883"
    environment:
      <<: *rockskyd-env
      WEBSCROBBLER_HOST: 0.0.0.0
      WEBSCROBBLER_PORT: "7883"
      SPOTIFY_API_URL: ${SPOTIFY_API_URL:-}
      DEEZER_URL: ${DEEZER_URL:-}

  # Optional. Without it the response cache is in-process, which is the right
  # answer for a single instance.
  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    command: --maxmemory=4g
    ports:
      - "6379:6379"
    ulimits:
      memlock:
        soft: -1
        hard: -1

volumes:
  data:
  nats:
  typesense:
  tap:
