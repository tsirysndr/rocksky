[package]
name = "rocksky-feeds"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Rocksky ATProto feed generator — genre feeds over the scrobble history"

[[bin]]
name = "rocksky-feeds"
path = "src/main.rs"

[dependencies]
rocksky-db = { path = "../db" }
rocksky-lexicon = { path = "../lexicon" }

actix-web = "4.11.0"
actix-cors = "0.7.1"
tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "= 0.4.39", features = ["serde"] }
sqlx = { version = "0.8.6", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "sqlite",
  "postgres",
  "chrono",
  "derive",
] }

anyhow = "1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenv = "0.15.0"
