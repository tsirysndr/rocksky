[package]
name = "rocksky-db"
version = "0.1.0"
description = "The Rocksky data layer: SQLite and Postgres behind one query builder, with the RSQL filter compiler"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rocksky-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "= 0.4.39", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1.41"
xid = "1.1.1"

sqlx = { version = "0.8.6", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "postgres",
  "chrono",
  "json",
  "macros",
  "migrate",
] }
sea-query = "0.32"
sea-query-binder = { version = "0.7", features = ["sqlx-sqlite", "sqlx-postgres", "with-chrono"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
