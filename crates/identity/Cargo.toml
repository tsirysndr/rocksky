[package]
name = "rocksky-identity"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ATProto identity resolution: DID to handle, handle to DID, with caching"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }
# DNS TXT lookups for `_atproto.<handle>`, which is the half of handle
# resolution that HTTP cannot do.
hickory-resolver = { version = "0.24", default-features = false, features = [
  "tokio-runtime",
  # Reads the host's resolv.conf. Without it there is no way to learn the
  # system's nameservers, and a hard-coded public resolver would break a
  # split-horizon or private-DNS deployment.
  "system-config",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
thiserror = "2"
tracing = "0.1.41"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
