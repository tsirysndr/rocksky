# PureScript SDK and module scopes for local development and GitHub Actions.
[modules.purescript]
source = ".dagger/sdk/purescript"

[sdks.purescript]
module = "purescript"

[sdks.purescript.scopes.".dagger/go"]
is-module = true
name = "go-checks"

[sdks.purescript.scopes.".dagger/typescript"]
is-module = true
name = "typescript-checks"

[sdks.purescript.scopes.".dagger/rust"]
is-module = true
name = "rust-checks"

[sdks.purescript.scopes.".dagger/elixir"]
is-module = true
name = "elixir-checks"

[sdks.purescript.scopes.".dagger/ops"]
is-module = true
name = "release-ops"
clients = ["./.dagger/github-release", "./.dagger/artifacts"]

[sdks.purescript.scopes.".dagger/github-release"]
is-module = true
name = "github-release"

[sdks.purescript.scopes.".dagger/artifacts"]
is-module = true
name = "release-artifacts"

[sdks.purescript.scopes.".dagger/eas"]
is-module = true
name = "eas-android"
clients = ["./.dagger/android-sdk"]

[sdks.purescript.scopes.".dagger/android-sdk"]
is-module = true
name = "android-sdk"
