[workspace]

[package]
name = "riff"
version = "0.1.0"
authors = ["Tsiry Sandratraina <tsiry.sndr@rocksky.app"]
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/tsirysndr/rocksky"

[features]
# Explicit fallback for Nix and platforms without an official static archive.
bundled-duckdb = ["duckdb/bundled", "duckdb/parquet", "duckdb/json"]

[dependencies]
actix-web = "4.11"
clap = { version = "4.5", features = ["derive", "env"] }
# cargo.sh downloads the matching static library with JSON and Parquet included.
# Pin the Rust bindings and the downloaded C library together.
duckdb = { version = "=1.10505.0", features = ["r2d2"] }
env_logger = "0.11"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
log = "0.4"
r2d2 = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
