plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = "expo.modules.rockskyengine"
version = "0.1.0"

android {
  namespace "expo.modules.rockskyengine"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

// Every build compiles Rust from the archived source. Missing tools fail the
// build instead of silently shipping an APK without its playback engine.
def rustBuildScript = file("${projectDir}/../../../scripts/build-android-engine.sh")
tasks.register("buildRustEngine", Exec) {
  workingDir file("${projectDir}/../../..")
  commandLine "bash", rustBuildScript.absolutePath
}
preBuild.dependsOn("buildRustEngine")
