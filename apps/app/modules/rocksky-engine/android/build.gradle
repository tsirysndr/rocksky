plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = "expo.modules.rockskyengine"
version = "0.1.0"

android {
  namespace "expo.modules.rockskyengine"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

// Cross-compile the Rust engine into jniLibs; skipped without cargo-ndk, in
// which case previously built .so files are packaged as-is.
def rustCrateDir = file("${projectDir}/../../../native/engine")
def jniLibsDir = file("${projectDir}/src/main/jniLibs")
def cargoBin = new File(System.getProperty("user.home"), ".cargo/bin/cargo")
def cargoNdkBin = new File(System.getProperty("user.home"), ".cargo/bin/cargo-ndk")

tasks.register("buildRustEngine", Exec) {
  workingDir rustCrateDir
  environment "PATH", "${System.getenv("PATH")}${File.pathSeparator}${cargoBin.parentFile.absolutePath}"
  if (System.getenv("ANDROID_NDK_HOME") == null) {
    environment "ANDROID_HOME",
      System.getenv("ANDROID_HOME") ?: "${System.getProperty('user.home')}/Library/Android/sdk"
  }
  commandLine cargoBin.absolutePath, "ndk",
    "-t", "arm64-v8a", "-t", "x86_64",
    "-o", jniLibsDir.absolutePath,
    "build", "--release"
  onlyIf { cargoBin.exists() && cargoNdkBin.exists() }
}
preBuild.dependsOn("buildRustEngine")
