[package]
name = "rocksky-metadata"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rockbox-metadata = "0.1"
lofty = "0.22"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }

tempfile = "3"
sha2 = "0.10"
base64 = "0.22"
symphonia = { version = "0.5", default-features = false, features = ["flac", "mp3", "aac", "alac", "isomp4", "vorbis", "ogg", "wav", "aiff", "pcm", "adpcm"] }

[workspace]
