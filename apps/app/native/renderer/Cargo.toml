[package]
name = "rocksky-renderer"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
socket2 = { version = "0.5", features = ["all"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }

[workspace]
