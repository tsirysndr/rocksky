name: riff

on:
  push:
    paths:
      - "riff/**"
      - ".dagger/**"
      - ".github/actions/dagger/**"
      - "dagger.toml"
      - "dagger.lock"
      - ".github/workflows/riff.yml"
  pull_request:
    paths:
      - "riff/**"
      - ".dagger/**"
      - ".github/actions/dagger/**"
      - "dagger.toml"
      - "dagger.lock"
      - ".github/workflows/riff.yml"

defaults:
  run:
    working-directory: .dagger

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Dagger CLI
        uses: ./.github/actions/setup-dagger
      - name: Riff lint, tests, and HTTP smoke checks (PureScript Dagger)
        uses: ./.github/actions/dagger
        with:
          module: rust
          key: rust-riff
          volumes: rocksky-cargo-registry,rocksky-cargo-git,rocksky-rust-riff
          command: |
            dagger api call -m rust riff --source ../riff
