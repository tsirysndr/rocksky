name: riff
'on':
  push:
    paths:
    - riff/**
    - .fluentci/**
    - .github/actions/**
    - fluentci.toml
    - .github/workflows/fluentci-modules.yml
    - .github/workflows/riff.yml
  pull_request:
    paths:
    - riff/**
    - .fluentci/**
    - .github/actions/**
    - fluentci.toml
    - .github/workflows/fluentci-modules.yml
    - .github/workflows/riff.yml
jobs:
  fluentci-modules:
    permissions:
      contents: read
    uses: ./.github/workflows/fluentci-modules.yml
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up FluentCI
      uses: ./.github/actions/setup-fluentci
    - name: Riff lint, tests, and HTTP smoke checks (PureScript FluentCI)
      uses: ./.github/actions/fluentci
      with:
        module: rust
        function: riff
        arguments: '{"source":"riff"}'
    needs:
    - fluentci-modules
