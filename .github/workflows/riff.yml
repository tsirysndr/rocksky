name: riff

on:
  push:
    paths:
      - "riff/**"
      - ".dagger/**"
      - ".github/actions/dagger/**"
      - "dagger.toml"
      - "dagger.lock"
      - ".github/workflows/riff.yml"
  pull_request:
    paths:
      - "riff/**"
      - ".dagger/**"
      - ".github/actions/dagger/**"
      - "dagger.toml"
      - "dagger.lock"
      - ".github/workflows/riff.yml"

defaults:
  run:
    working-directory: .dagger

env:
  DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
  DAGGER_ENGINE: cloud

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Dagger CLI
        uses: ./.github/actions/setup-dagger
      - name: Riff lint, tests, and HTTP smoke checks (PureScript Dagger)
        uses: ./.github/actions/dagger
        with:
          command: |
            dagger api call -m rust riff --source ../riff
