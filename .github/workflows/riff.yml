name: riff

on:
  push:
    paths:
      - "riff/**"
      - ".dagger/**"
      - "dagger.toml"
      - "dagger.lock"
      - ".github/workflows/riff.yml"
  pull_request:
    paths:
      - "riff/**"
      - ".dagger/**"
      - "dagger.toml"
      - "dagger.lock"
      - ".github/workflows/riff.yml"

defaults:
  run:
    working-directory: .dagger

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Dagger CLI
        run: bash install-dagger.sh
      - name: Riff lint, tests, and HTTP smoke checks (PureScript Dagger)
        run: dagger api call -m rust riff --source ../riff
