name: nix-build
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
jobs:
  fluentci-modules:
    permissions:
      contents: read
    uses: ./.github/workflows/fluentci-modules.yml
  nix-build:
    name: nix build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - ubuntu-24.04-arm
        - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up FluentCI
      uses: ./.github/actions/setup-fluentci
    - name: Install Nix
      if: runner.os != 'Linux'
      uses: DeterminateSystems/nix-installer-action@main
    - name: Set up Cachix
      if: runner.os != 'Linux'
      uses: cachix/cachix-action@v17
      with:
        name: rocksky
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Build native Nix packages with FluentCI
      if: runner.os != 'Linux'
      uses: ./.github/actions/fluentci
      with:
        module: host
        function: nixBuild
        arguments: '{}'
    - name: Build Linux Nix packages (PureScript FluentCI)
      if: runner.os == 'Linux'
      env:
        CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        NIX_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
      uses: ./.github/actions/fluentci
      with:
        module: ops
        function: nixBuild
        arguments: '{"source":".","cachixToken":"env://CACHIX_AUTH_TOKEN","runId":"$NIX_RUN"}'
    needs:
    - fluentci-modules
