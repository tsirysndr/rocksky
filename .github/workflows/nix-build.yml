name: nix-build
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
jobs:
  fluentci-modules:
    permissions:
      contents: read
    uses: ./.github/workflows/fluentci-modules.yml
  nix-build:
    name: nix build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - ubuntu-24.04-arm
        - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up FluentCI
      uses: ./.github/actions/setup-fluentci
    - name: Set up Determinate Nix through FluentCI
      shell: bash
      run: |
        set -euo pipefail
        trusted_users=$(id -un)
        fluentci --check-update=false run setup-determinate-nix@0.2.2 setup --sudo --trusted-users "$trusted_users" | python3 .github/scripts/export-setup-env.py
    - name: Build Nix packages with FluentCI binary cache
      env:
        FLUENTCI_CACHE_URL: ${{ vars.FLUENTCI_CACHE_URL }}
        FLUENTCI_NIX_PUBLIC_KEY: ${{ vars.FLUENTCI_NIX_PUBLIC_KEY }}
        FLUENTCI_CACHE_TOKEN: ${{ secrets.FLUENTCI_CACHE_TOKEN }}
        FLUENTCI_NIX_SIGNING_KEY: ${{ secrets.FLUENTCI_NIX_SIGNING_KEY }}
      uses: ./.github/actions/fluentci
      with:
        module: host
        function: nixBuild
        arguments: '{}'
    needs:
    - fluentci-modules
