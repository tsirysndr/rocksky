name: build
'on':
  push:
    tags-ignore:
    - bindings-v*
    - erlang-v*
    - gleam-v*
    - playerd-v*
    - playerd-[0-9]*
    - desktop-v*
jobs:
  fluentci-modules:
    permissions:
      contents: read
    uses: ./.github/workflows/fluentci-modules.yml
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      rockskyd: ${{ steps.filter.outputs.rockskyd }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up FluentCI
      uses: ./.github/actions/setup-fluentci
    - name: Validate deployment orchestration
      uses: ./.github/actions/fluentci
      with:
        module: host
        function: validate
        arguments: '{}'
    - name: Read production change filters
      id: inventory
      uses: ./.github/actions/fluentci
      with:
        module: host
        function: productionFilters
        arguments: '{}'
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: ${{ steps.inventory.outputs.filters }}
    needs:
    - fluentci-modules
  rockskyd:
    needs:
    - fluentci-modules
    - changes
    if: needs.changes.outputs.rockskyd == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Set up FluentCI
      uses: ./.github/actions/setup-fluentci
    - name: Build production Rust executables (PureScript FluentCI)
      uses: ./.github/actions/fluentci
      with:
        module: rust
        function: productionBinaries
        arguments: '{"source":".","output":"target/release"}'
    - name: Upload production Rust executables
      uses: actions/upload-artifact@v4
      with:
        name: production-rust
        path: |
          target/release/rockskyd
          target/release/rocksky-submissions
        if-no-files-found: error
  deploy:
    needs:
    - fluentci-modules
    - changes
    - rockskyd
    if: |
      always() && !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.services != '[]' &&
      (needs.rockskyd.result == 'success' ||
       (needs.rockskyd.result == 'skipped' && needs.changes.outputs.rockskyd != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: rocksky-production-deploy
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
    - name: Set up FluentCI
      uses: ./.github/actions/setup-fluentci
    - name: Download production Rust executables
      if: needs.changes.outputs.rockskyd == 'true'
      uses: actions/download-artifact@v4
      with:
        name: production-rust
        path: target/release
    - name: Deploy selected active production services (PureScript FluentCI)
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        DEPLOY_HOST: ${{ vars.ROCKSKY_DEPLOY_HOST }}
        DEPLOY_KNOWN_HOSTS: ${{ vars.ROCKSKY_DEPLOY_KNOWN_HOSTS }}
        DEPLOY_SERVICES: ${{ needs.changes.outputs.services }}
        DEPLOY_COMMIT: ${{ github.sha }}
        DEPLOY_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
      uses: ./.github/actions/fluentci
      with:
        module: ops
        function: deploy
        arguments: '{"artifacts":"target/release","privateKey":"env://SSH_PRIVATE_KEY","services":"$DEPLOY_SERVICES","commit":"$DEPLOY_COMMIT","runId":"$DEPLOY_RUN","host":"$DEPLOY_HOST","knownHosts":"$DEPLOY_KNOWN_HOSTS"}'
