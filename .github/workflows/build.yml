name: build
on:
  push:
    # The SDK binding tags only trigger bindings-release.yml (native libs → GitHub
    # release); don't run the app build for them.
    tags-ignore:
      - "bindings-v*"
      - "erlang-v*"
      - "gleam-v*"
      - "playerd-v*"
      - "playerd-[0-9]*"
      - "desktop-v*"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      rockskyd: ${{ steps.filter.outputs.rockskyd }}
      embed: ${{ steps.filter.outputs.embed }}
      feeds: ${{ steps.filter.outputs.feeds }}
      ws: ${{ steps.filter.outputs.ws }}
      mb: ${{ steps.filter.outputs.mb }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/build.yml'
            rockskyd:
              - '.dagger/**'
              - '.github/actions/dagger/**'
              - 'dagger.toml'
              - 'dagger.lock'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/build.yml'
            embed:
              - 'apps/embed/**'
              - '.github/workflows/build.yml'
            feeds:
              - 'apps/feeds/**'
              - '.github/workflows/build.yml'
            ws:
              - 'apps/ws/**'
              - '.github/workflows/build.yml'
            mb:
              - 'musicbrainz/**'
              - '.github/workflows/build.yml'

  rockskyd:
    needs: changes
    if: needs.changes.outputs.rockskyd == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Dagger CLI
        working-directory: .dagger
        run: bash install-dagger.sh
      - name: Build rockskyd release binary (PureScript Dagger)
        uses: ./.github/actions/dagger
        with:
          module: rust
          key: rust-rockskyd
          volumes: rocksky-cargo-registry,rocksky-cargo-git,rocksky-rockskyd-release-amd64
          command: |
            mkdir -p ../target/release
            dagger api call -m rust rockskyd --source .. --output ../target/release/rockskyd

      - name: Upload rockskyd binary
        uses: actions/upload-artifact@v4
        with:
          name: rockskyd
          path: target/release/rockskyd
          if-no-files-found: error

  deploy:
    needs: [changes, rockskyd]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.rockskyd.result != 'failure' &&
      (needs.rockskyd.result == 'success' ||
       needs.changes.outputs.api == 'true' ||
       needs.changes.outputs.embed == 'true' ||
       needs.changes.outputs.feeds == 'true' ||
       needs.changes.outputs.ws == 'true' ||
       needs.changes.outputs.mb == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download rockskyd binary
        if: needs.changes.outputs.rockskyd == 'true'
        uses: actions/download-artifact@v4
        with:
          name: rockskyd
          path: target/release
      - name: Install pinned Dagger CLI
        working-directory: .dagger
        run: bash install-dagger.sh
      - name: Deploy selected services (PureScript Dagger)
        working-directory: .dagger
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          DEPLOY_API: ${{ needs.changes.outputs.api }}
          DEPLOY_ROCKSKYD: ${{ needs.changes.outputs.rockskyd }}
          DEPLOY_EMBED: ${{ needs.changes.outputs.embed }}
          DEPLOY_FEEDS: ${{ needs.changes.outputs.feeds }}
          DEPLOY_WS: ${{ needs.changes.outputs.ws }}
          DEPLOY_MB: ${{ needs.changes.outputs.mb }}
          DEPLOY_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p ../target/release
          dagger api call -m ops deploy --scripts ops/scripts --artifacts ../target/release \
            --private-key env://SSH_PRIVATE_KEY --public-key env://SSH_PUBLIC_KEY \
            --api "$DEPLOY_API" --rockskyd "$DEPLOY_ROCKSKYD" --embed "$DEPLOY_EMBED" \
            --feeds "$DEPLOY_FEEDS" --ws "$DEPLOY_WS" --mb "$DEPLOY_MB" --run-id "$DEPLOY_RUN"
