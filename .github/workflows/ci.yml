name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .dagger
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Dagger CLI
        run: bash install-dagger.sh
      - name: Rust formatting and tracklist tests (PureScript Dagger)
        run: dagger api call -m rust tracklist --source ..
