name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .dagger
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Dagger CLI
        uses: ./.github/actions/setup-dagger
      - name: Rust formatting and tracklist tests (PureScript Dagger)
        uses: ./.github/actions/dagger
        with:
          module: rust
          key: rust-tracklist
          volumes: rocksky-cargo-registry,rocksky-cargo-git,rocksky-rust-tracklist
          command: |
            dagger api call -m rust tracklist --source ..
