name: ci
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
jobs:
  fluentci-modules:
    permissions:
      contents: read
    uses: ./.github/workflows/fluentci-modules.yml
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up FluentCI
      uses: ./.github/actions/setup-fluentci
    - name: Rust formatting and tracklist tests (PureScript FluentCI)
      uses: ./.github/actions/fluentci
      with:
        module: rust
        function: tracklist
        arguments: '{"source":"."}'
    needs:
    - fluentci-modules
