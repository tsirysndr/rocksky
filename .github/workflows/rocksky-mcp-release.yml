name: rocksky-mcp-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default rocksky-mcp-v<version> from rocksky-mcp/Cargo.toml)"
        type: string
        required: false
  push:
    tags:
      - "rocksky-mcp-v*"

permissions:
  contents: write

defaults:
  run:
    working-directory: rocksky-mcp

env:
  DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dagger
        with:
          install-dagger: ${{ runner.os == 'Linux' }}
      - name: Resolve release tag
        id: tag
        working-directory: .
        env:
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
        run: node .dagger/host/run.mjs resolve-tag rocksky-mcp

      - name: Ensure release exists (PureScript Dagger)
        working-directory: .dagger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: dagger api call -m ops ensure-release --project rocksky-mcp --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --token env://GH_TOKEN --run-id "$RELEASE_RUN"

  build:
    needs: prepare-release
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dagger
        with:
          install-dagger: ${{ runner.os == 'Linux' }}
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Linux'
        with:
          workspaces: rocksky-mcp
          shared-key: rocksky-mcp-${{ matrix.target }}
          cache-on-failure: true
      - name: cargo build --release
        if: runner.os != 'Linux'
        run: cargo build --release --target ${{ matrix.target }}
      - name: Build Linux MCP release binary (PureScript Dagger)
        if: runner.os == 'Linux'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        uses: ./.github/actions/dagger
        with:
          command: |
            mkdir -p "../rocksky-mcp/target/$RELEASE_TARGET/release"
            dagger api call -m rust mcp-release --source .. --target "$RELEASE_TARGET" \
              --output "../rocksky-mcp/target/$RELEASE_TARGET/release/rocksky-mcp"

      # Native macOS and Windows builds and all release packaging stay on the runner.
      - name: Package tarball
        if: runner.os != 'Linux'
        working-directory: .
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: node .dagger/host/run.mjs package-native rocksky-mcp

      - name: Upload to release
        if: runner.os != 'Linux'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: node .dagger/host/run.mjs upload rocksky-mcp rocksky-mcp-

      - name: Package and upload Linux release (PureScript Dagger)
        if: runner.os == 'Linux'
        working-directory: .dagger
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          dagger api call -m ops package-release --binary "../rocksky-mcp/target/$RELEASE_TARGET/release/rocksky-mcp" \
            --project rocksky-mcp --tag "$RELEASE_TAG" --target "$RELEASE_TARGET" --output "$RUNNER_TEMP/release-assets"
          dagger api call -m ops upload-release --assets "$RUNNER_TEMP/release-assets" \
            --tag "$RELEASE_TAG" --token env://GH_TOKEN --run-id "$RELEASE_RUN"
