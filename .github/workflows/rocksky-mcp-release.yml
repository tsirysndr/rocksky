name: rocksky-mcp-release
'on':
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (default rocksky-mcp-v<version> from rocksky-mcp/Cargo.toml)
        type: string
        required: false
  push:
    tags:
    - rocksky-mcp-v*
permissions:
  contents: write
jobs:
  fluentci-modules:
    permissions:
      contents: read
    uses: ./.github/workflows/fluentci-modules.yml
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up FluentCI
      uses: ./.github/actions/setup-fluentci
    - name: Resolve release tag
      id: tag
      env:
        RELEASE_INPUT_TAG: ${{ inputs.tag }}
      uses: ./.github/actions/fluentci
      with:
        module: host
        function: resolveTag
        arguments: '{"project":"rocksky-mcp"}'
    - name: Ensure release exists (PureScript FluentCI)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        RELEASE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
      uses: ./.github/actions/fluentci
      with:
        module: ops
        function: ensureRelease
        arguments: '{"project":"rocksky-mcp","tag":"$RELEASE_TAG","commit":"$GITHUB_SHA","token":"env://GH_TOKEN","runId":"$RELEASE_RUN"}'
    needs:
    - fluentci-modules
  build:
    needs:
    - fluentci-modules
    - prepare-release
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: aarch64-apple-darwin
          os: macos-latest
        - target: x86_64-apple-darwin
          os: macos-latest
        - target: x86_64-unknown-linux-gnu
          os: ubuntu-latest
        - target: aarch64-unknown-linux-gnu
          os: ubuntu-24.04-arm
        - target: x86_64-pc-windows-msvc
          os: windows-latest
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
    - uses: actions/checkout@v4
    - name: Set up FluentCI
      uses: ./.github/actions/setup-fluentci
    - uses: dtolnay/rust-toolchain@stable
      if: runner.os != 'Linux'
      with:
        targets: ${{ matrix.target }}
    - uses: Swatinem/rust-cache@v2
      if: runner.os != 'Linux'
      with:
        workspaces: rocksky-mcp
        shared-key: rocksky-mcp-${{ matrix.target }}
        cache-on-failure: true
    - name: Build native release with FluentCI
      if: runner.os != 'Linux'
      uses: ./.github/actions/fluentci
      with:
        module: host
        function: buildMcp
        arguments: '{"target":"${{ matrix.target }}"}'
    - name: Build Linux MCP release binary (PureScript FluentCI)
      if: runner.os == 'Linux'
      env:
        RELEASE_TARGET: ${{ matrix.target }}
      uses: ./.github/actions/fluentci
      with:
        module: rust
        function: mcpRelease
        arguments: '{"source":".","target":"$RELEASE_TARGET","output":"rocksky-mcp/target/$RELEASE_TARGET/release/rocksky-mcp"}'
    - name: Package tarball
      if: runner.os != 'Linux'
      env:
        RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        RELEASE_TARGET: ${{ matrix.target }}
      uses: ./.github/actions/fluentci
      with:
        module: host
        function: packageNative
        arguments: '{"project":"rocksky-mcp"}'
    - name: Upload to release
      if: runner.os != 'Linux'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
      uses: ./.github/actions/fluentci
      with:
        module: host
        function: upload
        arguments: '{"directory":"rocksky-mcp","prefix":"rocksky-mcp-"}'
    - name: Package and upload Linux release (PureScript FluentCI) — binary
      if: runner.os == 'Linux'
      env:
        RELEASE_TARGET: ${{ matrix.target }}
        RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
      uses: ./.github/actions/fluentci
      with:
        module: artifacts
        function: binary
        arguments: '{"binary":"rocksky-mcp/target/$RELEASE_TARGET/release/rocksky-mcp","executableName":"rocksky-mcp","name":"$RELEASE_TAG-$RELEASE_TARGET","output":"$RUNNER_TEMP/release-assets"}'
    - name: Package and upload Linux release (PureScript FluentCI) — upload
      if: runner.os == 'Linux'
      env:
        RELEASE_TARGET: ${{ matrix.target }}
        RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
      uses: ./.github/actions/fluentci
      with:
        module: github-release
        function: upload
        arguments: '{"repository":"$GITHUB_REPOSITORY","clobber":true,"assets":"$RUNNER_TEMP/release-assets","tag":"$RELEASE_TAG","token":"env://GH_TOKEN","runId":"$RELEASE_RUN"}'
