name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which areas changed so each suite only runs when its files (or this
  # workflow) changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api_contracts: ${{ steps.filter.outputs.api_contracts }}
      cli: ${{ steps.filter.outputs.cli }}
      ts_sdk: ${{ steps.filter.outputs.ts_sdk }}
      go_sdk: ${{ steps.filter.outputs.go_sdk }}
      rust_sdk: ${{ steps.filter.outputs.rust_sdk }}
      deezer: ${{ steps.filter.outputs.deezer }}
      remote_ws: ${{ steps.filter.outputs.remote_ws }}
      submissions: ${{ steps.filter.outputs.submissions }}
      matching: ${{ steps.filter.outputs.matching }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api_contracts:
              - 'apps/api/**'
              - 'crates/appview/tests/fixtures/**'
              - 'bun.lock'
              - '.github/workflows/tests.yml'
            cli:
              - 'apps/cli/**'
              - '.github/workflows/tests.yml'
            ts_sdk:
              - 'sdk/typescript/**'
              - '.github/workflows/tests.yml'
            go_sdk:
              - 'sdk/go/**'
              - '.github/workflows/tests.yml'
            rust_sdk:
              - 'sdk/rust/**'
              - '.github/workflows/tests.yml'
            deezer:
              - 'deezer/**'
              - '.github/workflows/tests.yml'
            remote_ws:
              - 'remote-ws/**'
              - '.github/workflows/tests.yml'
            submissions:
              - 'crates/submissions/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/tests.yml'
            matching:
              - 'crates/matching/**'
              - 'crates/core/**'
              - 'crates/db/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/tests.yml'

  api-contracts:
    needs: changes
    if: needs.changes.outputs.api_contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies without native lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Audit XRPC response contracts
        working-directory: apps/api
        run: bun run audit:xrpc
      - name: Test matching API outcomes and candidate metadata
        working-directory: apps/api
        run: bun test src/xrpc/app/rocksky/song/matchingService.test.ts src/xrpc/app/rocksky/song/matchSongUris.test.ts
      - name: Test durable submission and record ownership boundaries
        working-directory: apps/api
        run: bun test src/lib/durableSubmission.test.ts src/lib/durableRecord.test.ts src/lib/recordOwnership.test.ts

  submissions:
    needs: changes
    if: needs.changes.outputs.submissions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: submissions_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d submissions_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Verify dashboard tests and committed build
        working-directory: crates/submissions/dashboard
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run check:dist
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Test default PostgreSQL backend
        env:
          SUBMISSIONS_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/submissions_test
        run: cargo test --locked -p rocksky-submissions -- --include-ignored
      - name: Test SQLite-only backend
        run: cargo test --locked -p rocksky-submissions --no-default-features --features sqlite
      - name: Test both backends together
        env:
          SUBMISSIONS_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/submissions_test
        run: cargo test --locked -p rocksky-submissions --all-features -- --include-ignored
      - name: Build standalone worker with default PostgreSQL backend
        run: cargo build --locked -p rocksky-submissions
      - name: Test HTTP intake, process crash recovery, and retries
        env:
          SUBMISSIONS_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/submissions_test
        run: python3 crates/submissions/tests/http_smoke.py target/debug/rocksky-submissions

  matching:
    needs: changes
    if: needs.changes.outputs.matching == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run full matching regression suite
        run: bash crates/matching/scripts/validate.sh

  cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Bun skips dependency lifecycle scripts by default, so the native/optional
      # deps (rockbox-ffi, better-sqlite3, …) don't need a build toolchain here;
      # classic-level loads from its shipped linux-x64 prebuild.
      - name: Install dependencies
        run: bun install
      - name: Run CLI tests
        run: bun run test

  typescript-sdk:
    needs: changes
    if: needs.changes.outputs.ts_sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run TypeScript SDK tests
        run: bun test

  go-sdk:
    needs: changes
    if: needs.changes.outputs.go_sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: sdk/go/go.sum
      - name: Run Go SDK tests
        run: go test ./...

  rust-sdk:
    needs: changes
    if: needs.changes.outputs.rust_sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust
      - name: Run Rust SDK tests
        run: cargo test

  deezer:
    needs: changes
    if: needs.changes.outputs.deezer == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deezer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: deezer/go.mod
          cache-dependency-path: deezer/go.sum
      # The live Deezer smoke test is gated behind DEEZER_SMOKE and stays off in
      # CI so the suite never depends on the external API or its rate limits.
      - name: Run Deezer service tests
        run: go test ./...

  remote-ws:
    needs: changes
    if: needs.changes.outputs.remote_ws == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote-ws
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      # The relay's unit tests use in-memory doubles (config/test.exs
      # start_externals: false), so no Postgres / Redis / NATS services are needed.
      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            remote-ws/deps
            remote-ws/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('remote-ws/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Install dependencies
        run: mix deps.get
      - name: Run tests
        run: mix test
