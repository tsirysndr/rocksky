name: tests
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fluentci-modules:
    permissions:
      contents: read
    uses: ./.github/workflows/fluentci-modules.yml
  changes:
    runs-on: ubuntu-latest
    outputs:
      api_contracts: ${{ steps.filter.outputs.api_contracts }}
      cli: ${{ steps.filter.outputs.cli }}
      ts_sdk: ${{ steps.filter.outputs.ts_sdk }}
      go_sdk: ${{ steps.filter.outputs.go_sdk }}
      rust_sdk: ${{ steps.filter.outputs.rust_sdk }}
      deezer: ${{ steps.filter.outputs.deezer }}
      remote_ws: ${{ steps.filter.outputs.remote_ws }}
      submissions: ${{ steps.filter.outputs.submissions }}
      matching: ${{ steps.filter.outputs.matching }}
      musicbrainz: ${{ steps.filter.outputs.musicbrainz }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          api_contracts:
            - 'package.json'
            - '**/package.json'
            - 'patches/**'
            - '.fluentci/**'
            - '.github/actions/**'
            - 'fluentci.toml'
            - '.github/workflows/fluentci-modules.yml'
            - 'apps/api/**'
            - 'crates/appview/tests/fixtures/**'
            - 'bun.lock'
            - '.github/workflows/tests.yml'
          cli:
            - 'apps/cli/**'
            - '.fluentci/**'
            - '.github/actions/**'
            - 'fluentci.toml'
            - '.github/workflows/fluentci-modules.yml'
            - '.github/workflows/tests.yml'
          ts_sdk:
            - 'sdk/typescript/**'
            - '.fluentci/**'
            - '.github/actions/**'
            - 'fluentci.toml'
            - '.github/workflows/fluentci-modules.yml'
            - '.github/workflows/tests.yml'
          go_sdk:
            - 'sdk/go/**'
            - '.fluentci/**'
            - '.github/actions/**'
            - 'fluentci.toml'
            - '.github/workflows/fluentci-modules.yml'
            - '.github/workflows/tests.yml'
          rust_sdk:
            - 'sdk/rust/**'
            - '.fluentci/**'
            - '.github/actions/**'
            - 'fluentci.toml'
            - '.github/workflows/fluentci-modules.yml'
            - '.github/workflows/tests.yml'
          deezer:
            - 'deezer/**'
            - '.fluentci/**'
            - '.github/actions/**'
            - 'fluentci.toml'
            - '.github/workflows/fluentci-modules.yml'
            - 'otel/**'
            - '.github/workflows/tests.yml'
          remote_ws:
            - '.fluentci/**'
            - '.github/actions/**'
            - 'fluentci.toml'
            - '.github/workflows/fluentci-modules.yml'
            - 'remote-ws/**'
            - '.github/workflows/tests.yml'
          submissions:
            - '.fluentci/**'
            - '.github/actions/**'
            - 'fluentci.toml'
            - '.github/workflows/fluentci-modules.yml'
            - 'crates/submissions/**'
            - 'crates/jetstream/**'
            - 'crates/db/**'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - '.github/workflows/tests.yml'
          musicbrainz:
            - 'musicbrainz/**'
            - 'otel/**'
            - '.fluentci/**'
            - '.github/actions/**'
            - 'fluentci.toml'
            - '.github/workflows/fluentci-modules.yml'
            - '.github/workflows/tests.yml'
          matching:
            - '.fluentci/**'
            - '.github/actions/**'
            - 'fluentci.toml'
            - '.github/workflows/fluentci-modules.yml'
            - 'crates/matching/**'
            - 'crates/core/**'
            - 'crates/db/**'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - '.github/workflows/tests.yml'
    needs:
    - fluentci-modules
  api-contracts:
    needs:
    - fluentci-modules
    - changes
    if: needs.changes.outputs.api_contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up FluentCI
      uses: ./.github/actions/setup-fluentci
    - name: API contracts and regression tests (PureScript FluentCI)
      uses: ./.github/actions/fluentci
      with:
        module: typescript
        function: apiContracts
        arguments: '{"source":"."}'
  submissions:
    needs:
    - fluentci-modules
    - changes
    if: needs.changes.outputs.submissions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up FluentCI
      uses: ./.github/actions/setup-fluentci
    - name: Submissions dashboard and worker checks (PureScript FluentCI)
      uses: ./.github/actions/fluentci
      with:
        module: rust
        function: submissions
        arguments: '{"source":"."}'
  matching:
    needs:
    - fluentci-modules
    - changes
    if: needs.changes.outputs.matching == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up FluentCI
      uses: ./.github/actions/setup-fluentci
    - name: Matching regression suite (PureScript FluentCI)
      uses: ./.github/actions/fluentci
      with:
        module: rust
        function: matching
        arguments: '{"source":"."}'
  cli:
    needs:
    - fluentci-modules
    - changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up FluentCI
      uses: ./.github/actions/setup-fluentci
    - name: CLI smoke tests (PureScript FluentCI)
      uses: ./.github/actions/fluentci
      with:
        module: typescript
        function: cli
        arguments: '{"source":"apps/cli"}'
  typescript-sdk:
    needs:
    - fluentci-modules
    - changes
    if: needs.changes.outputs.ts_sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up FluentCI
      uses: ./.github/actions/setup-fluentci
    - name: TypeScript SDK tests (PureScript FluentCI)
      uses: ./.github/actions/fluentci
      with:
        module: typescript
        function: sdk
        arguments: '{"source":"sdk/typescript"}'
  go-sdk:
    needs:
    - fluentci-modules
    - changes
    if: needs.changes.outputs.go_sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up FluentCI
      uses: ./.github/actions/setup-fluentci
    - name: Go SDK tests (PureScript FluentCI)
      uses: ./.github/actions/fluentci
      with:
        module: go
        function: sdk
        arguments: '{"source":"sdk/go"}'
  rust-sdk:
    needs:
    - fluentci-modules
    - changes
    if: needs.changes.outputs.rust_sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up FluentCI
      uses: ./.github/actions/setup-fluentci
    - name: Rust SDK tests (PureScript FluentCI)
      uses: ./.github/actions/fluentci
      with:
        module: rust
        function: sdk
        arguments: '{"source":"sdk/rust"}'
  deezer:
    needs:
    - fluentci-modules
    - changes
    if: needs.changes.outputs.deezer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up FluentCI
      uses: ./.github/actions/setup-fluentci
    - name: Deezer tests (PureScript FluentCI)
      uses: ./.github/actions/fluentci
      with:
        module: go
        function: deezer
        arguments: '{"source":"deezer","otel":"otel"}'
  remote-ws:
    needs:
    - fluentci-modules
    - changes
    if: needs.changes.outputs.remote_ws == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up FluentCI
      uses: ./.github/actions/setup-fluentci
    - name: Remote WebSocket relay tests (PureScript FluentCI)
      uses: ./.github/actions/fluentci
      with:
        module: elixir
        function: remoteWs
        arguments: '{"source":"remote-ws"}'
  musicbrainz:
    needs:
    - fluentci-modules
    - changes
    if: needs.changes.outputs.musicbrainz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up FluentCI
      uses: ./.github/actions/setup-fluentci
    - name: MusicBrainz race tests and build (PureScript FluentCI)
      uses: ./.github/actions/fluentci
      with:
        module: go
        function: musicbrainz
        arguments: '{"source":"musicbrainz","otel":"otel"}'
