name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which areas changed so each suite only runs when its files (or this
  # workflow) changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      ts_sdk: ${{ steps.filter.outputs.ts_sdk }}
      go_sdk: ${{ steps.filter.outputs.go_sdk }}
      rust_sdk: ${{ steps.filter.outputs.rust_sdk }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cli:
              - 'apps/cli/**'
              - '.github/workflows/tests.yml'
            ts_sdk:
              - 'sdk/typescript/**'
              - '.github/workflows/tests.yml'
            go_sdk:
              - 'sdk/go/**'
              - '.github/workflows/tests.yml'
            rust_sdk:
              - 'sdk/rust/**'
              - '.github/workflows/tests.yml'

  cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Bun skips dependency lifecycle scripts by default, so the native/optional
      # deps (rockbox-ffi, better-sqlite3, …) don't need a build toolchain here;
      # classic-level loads from its shipped linux-x64 prebuild.
      - name: Install dependencies
        run: bun install
      - name: Run CLI tests
        run: bun run test

  typescript-sdk:
    needs: changes
    if: needs.changes.outputs.ts_sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run TypeScript SDK tests
        run: bun test

  go-sdk:
    needs: changes
    if: needs.changes.outputs.go_sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: sdk/go/go.sum
      - name: Run Go SDK tests
        run: go test ./...

  rust-sdk:
    needs: changes
    if: needs.changes.outputs.rust_sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust
      - name: Run Rust SDK tests
        run: cargo test
