name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which areas changed so each suite only runs when its files (or this
  # workflow) changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api_contracts: ${{ steps.filter.outputs.api_contracts }}
      cli: ${{ steps.filter.outputs.cli }}
      ts_sdk: ${{ steps.filter.outputs.ts_sdk }}
      go_sdk: ${{ steps.filter.outputs.go_sdk }}
      rust_sdk: ${{ steps.filter.outputs.rust_sdk }}
      deezer: ${{ steps.filter.outputs.deezer }}
      remote_ws: ${{ steps.filter.outputs.remote_ws }}
      submissions: ${{ steps.filter.outputs.submissions }}
      matching: ${{ steps.filter.outputs.matching }}
      musicbrainz: ${{ steps.filter.outputs.musicbrainz }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api_contracts:
              - 'package.json'
              - '**/package.json'
              - 'patches/**'
              - '.dagger/**'
              - '.github/actions/dagger/**'
              - 'dagger.toml'
              - 'dagger.lock'
              - 'apps/api/**'
              - 'crates/appview/tests/fixtures/**'
              - 'bun.lock'
              - '.github/workflows/tests.yml'
            cli:
              - 'apps/cli/**'
              - '.dagger/**'
              - '.github/actions/dagger/**'
              - 'dagger.toml'
              - 'dagger.lock'
              - '.github/workflows/tests.yml'
            ts_sdk:
              - 'sdk/typescript/**'
              - '.dagger/**'
              - '.github/actions/dagger/**'
              - 'dagger.toml'
              - 'dagger.lock'
              - '.github/workflows/tests.yml'
            go_sdk:
              - 'sdk/go/**'
              - '.dagger/**'
              - '.github/actions/dagger/**'
              - 'dagger.toml'
              - 'dagger.lock'
              - '.github/workflows/tests.yml'
            rust_sdk:
              - 'sdk/rust/**'
              - '.dagger/**'
              - '.github/actions/dagger/**'
              - 'dagger.toml'
              - 'dagger.lock'
              - '.github/workflows/tests.yml'
            deezer:
              - 'deezer/**'
              - '.dagger/**'
              - '.github/actions/dagger/**'
              - 'dagger.toml'
              - 'dagger.lock'
              - 'otel/**'
              - '.github/workflows/tests.yml'
            remote_ws:
              - '.dagger/**'
              - '.github/actions/dagger/**'
              - 'dagger.toml'
              - 'dagger.lock'
              - 'remote-ws/**'
              - '.github/workflows/tests.yml'
            submissions:
              - '.dagger/**'
              - '.github/actions/dagger/**'
              - 'dagger.toml'
              - 'dagger.lock'
              - 'crates/submissions/**'
              - 'crates/jetstream/**'
              - 'crates/db/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/tests.yml'
            musicbrainz:
              - 'musicbrainz/**'
              - 'otel/**'
              - '.dagger/**'
              - '.github/actions/dagger/**'
              - 'dagger.toml'
              - 'dagger.lock'
              - '.github/workflows/tests.yml'
            matching:
              - '.dagger/**'
              - '.github/actions/dagger/**'
              - 'dagger.toml'
              - 'dagger.lock'
              - 'crates/matching/**'
              - 'crates/core/**'
              - 'crates/db/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/tests.yml'

  api-contracts:
    needs: changes
    if: needs.changes.outputs.api_contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .dagger
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Dagger CLI
        uses: ./.github/actions/setup-dagger
      - name: API contracts and regression tests (PureScript Dagger)
        uses: ./.github/actions/dagger
        with:
          module: typescript
          key: typescript-api-contracts
          volumes: rocksky-api-bun
          command: |
            dagger api call -m typescript api-contracts --source ..

  submissions:
    needs: changes
    if: needs.changes.outputs.submissions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .dagger
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Dagger CLI
        uses: ./.github/actions/setup-dagger
      - name: Submissions dashboard and worker checks (PureScript Dagger)
        uses: ./.github/actions/dagger
        with:
          module: rust
          key: rust-submissions
          volumes: rocksky-cargo-registry,rocksky-cargo-git,rocksky-rust-submissions,rocksky-submissions-bun
          command: |
            dagger api call -m rust submissions --source ..

  matching:
    needs: changes
    if: needs.changes.outputs.matching == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .dagger
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Dagger CLI
        uses: ./.github/actions/setup-dagger
      - name: Matching regression suite (PureScript Dagger)
        uses: ./.github/actions/dagger
        with:
          module: rust
          key: rust-matching
          volumes: rocksky-cargo-registry,rocksky-cargo-git,rocksky-rust-matching
          command: |
            dagger api call -m rust matching --source ..

  cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .dagger
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Dagger CLI
        uses: ./.github/actions/setup-dagger
      - name: CLI smoke tests (PureScript Dagger)
        uses: ./.github/actions/dagger
        with:
          module: typescript
          key: typescript-cli
          volumes: rocksky-cli-bun
          command: |
            dagger api call -m typescript cli --source ../apps/cli

  typescript-sdk:
    needs: changes
    if: needs.changes.outputs.ts_sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .dagger
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Dagger CLI
        uses: ./.github/actions/setup-dagger
      - name: TypeScript SDK tests (PureScript Dagger)
        uses: ./.github/actions/dagger
        with:
          module: typescript
          key: typescript-sdk
          volumes: rocksky-typescript-bun
          command: |
            dagger api call -m typescript sdk --source ../sdk/typescript

  go-sdk:
    needs: changes
    if: needs.changes.outputs.go_sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .dagger
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Dagger CLI
        uses: ./.github/actions/setup-dagger
      - name: Go SDK tests (PureScript Dagger)
        uses: ./.github/actions/dagger
        with:
          module: go
          key: go-sdk
          volumes: rocksky-go-modules,rocksky-go-build
          command: |
            dagger api call -m go sdk --source ../sdk/go

  rust-sdk:
    needs: changes
    if: needs.changes.outputs.rust_sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .dagger
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Dagger CLI
        uses: ./.github/actions/setup-dagger
      - name: Rust SDK tests (PureScript Dagger)
        uses: ./.github/actions/dagger
        with:
          module: rust
          key: rust-sdk
          volumes: rocksky-cargo-registry,rocksky-cargo-git,rocksky-rust-sdk
          command: |
            dagger api call -m rust sdk --source ../sdk/rust

  deezer:
    needs: changes
    if: needs.changes.outputs.deezer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .dagger
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Dagger CLI
        uses: ./.github/actions/setup-dagger
      - name: Deezer tests (PureScript Dagger)
        uses: ./.github/actions/dagger
        with:
          module: go
          key: go-deezer
          volumes: rocksky-go-modules,rocksky-go-build
          command: |
            dagger api call -m go deezer --source ../deezer --otel ../otel

  remote-ws:
    needs: changes
    if: needs.changes.outputs.remote_ws == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .dagger
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Dagger CLI
        uses: ./.github/actions/setup-dagger
      - name: Remote WebSocket relay tests (PureScript Dagger)
        uses: ./.github/actions/dagger
        with:
          module: elixir
          key: elixir-remote-ws
          volumes: rocksky-elixir-hex,rocksky-remote-ws-deps,rocksky-remote-ws-build-1.18-27
          command: |
            dagger api call -m elixir remote-ws --source ../remote-ws

  musicbrainz:
    needs: changes
    if: needs.changes.outputs.musicbrainz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .dagger
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Dagger CLI
        uses: ./.github/actions/setup-dagger
      - name: MusicBrainz race tests and build (PureScript Dagger)
        uses: ./.github/actions/dagger
        with:
          module: go
          key: go-musicbrainz
          volumes: rocksky-go-modules,rocksky-go-build
          command: |
            dagger api call -m go musicbrainz --source ../musicbrainz --otel ../otel
