name: desktop-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default desktop-v<version> from desktop/src-tauri/tauri.conf.json)"
        type: string
        required: false
      linux_only:
        description: "Rebuild only Linux assets (preserve published macOS checksums)"
        type: boolean
        default: false
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            VER="$(jq -r .version desktop/src-tauri/tauri.conf.json)"
            [ -n "$VER" ] && [ "$VER" != "null" ] || { echo "could not read version from tauri.conf.json" >&2; exit 1; }
            TAG="desktop-v$VER"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#desktop-v}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG (version ${TAG#desktop-v})"
      - name: Install pinned Dagger CLI
        working-directory: .dagger
        run: bash install-dagger.sh
      - name: Ensure release exists (PureScript Dagger)
        working-directory: .dagger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: dagger api call -m ops ensure-release --scripts ops/scripts --project desktop --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --token env://GH_TOKEN --run-id "$RELEASE_RUN"

  build:
    needs: prepare-release
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Manual Linux repairs must not replace the DMGs referenced by Homebrew.
        include: ${{ fromJSON(inputs.linux_only && '[{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-22.04","bundles":"deb,rpm,appimage"}]' || '[{"target":"aarch64-apple-darwin","os":"macos-latest","bundles":"app"},{"target":"x86_64-apple-darwin","os":"macos-latest","bundles":"app"},{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-22.04","bundles":"deb,rpm,appimage"}]') }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4


      - uses: oven-sh/setup-bun@v2
        if: runner.os != 'Linux'
        with:
          bun-version: 1.2.15

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Linux'
        with:
          workspaces: desktop/src-tauri
          shared-key: desktop-${{ matrix.target }}
          cache-on-failure: true

      - name: Install workspace dependencies
        if: runner.os != 'Linux'
        working-directory: .
        run: bun install --frozen-lockfile

      # The desktop app resolves @rocksky/sdk through sdk/typescript/dist, which
      # is gitignored — without this the frontend's `tsc -b` cannot find the
      # module and every SDK-derived type collapses to an error.
      - name: Build @rocksky/sdk
        if: runner.os != 'Linux'
        working-directory: sdk/typescript
        run: bun run build

      - name: Stamp version from tag
        if: runner.os != 'Linux'
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > /tmp/conf.json
          mv /tmp/conf.json src-tauri/tauri.conf.json
          echo "bundle version: $(jq -r .version src-tauri/tauri.conf.json)"


      - name: tauri build
        if: runner.os != 'Linux'
        env:
          # Ad-hoc signing: no Apple Developer identity, no notarization. The
          # explicit codesign pass below is what actually guarantees it — this
          # only stops the bundler from leaving the binary fully unsigned.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          KLIPY_API_KEY: ${{ secrets.VITE_KLIPY_API_KEY }}
        run: |
          set -euo pipefail
          # `--mode prod` loads desktop/.env.prod; a non-empty repo secret
          # overrides the KLIPY key committed there (real env wins in Vite).
          if [ -n "${KLIPY_API_KEY:-}" ]; then
            export VITE_KLIPY_API_KEY="$KLIPY_API_KEY"
          fi
          extra_config=(--config '{"build":{"beforeBuildCommand":"bun run build:prod"}}')
          if [ "$RUNNER_OS" = Linux ]; then
            extra_config+=(--config "$RUNNER_TEMP/rocksky-appimage.json")
          fi
          bun run tauri build \
            --target ${{ matrix.target }} \
            --bundles ${{ matrix.bundles }} \
            "${extra_config[@]}"


      - name: Package macOS bundle (ad-hoc signed)
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          ARCH=$([ "${{ matrix.target }}" = "aarch64-apple-darwin" ] && echo aarch64 || echo x64)
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Rocksky.app"
          [ -d "$APP" ] || { echo "missing $APP" >&2; exit 1; }

          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          STAGE="$(mktemp -d)/Rocksky"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Rocksky" -srcfolder "$STAGE" -ov -format UDZO \
            "Rocksky_${VERSION}_${ARCH}.dmg"

          ditto -c -k --sequesterRsrc --keepParent "$APP" "Rocksky_${VERSION}_${ARCH}.app.zip"


      - name: Checksums
        if: runner.os != 'Linux'
        run: |
          set -euo pipefail
          for f in Rocksky_*; do
            case "$f" in *.sha256) continue;; esac
            shasum -a 256 "$f" > "$f.sha256"
          done
          ls -l Rocksky_*

      - name: Install pinned Dagger CLI
        if: runner.os == 'Linux'
        working-directory: .dagger
        run: bash install-dagger.sh
      - name: Build and verify Linux desktop bundles (PureScript Dagger)
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          KLIPY_API_KEY: ${{ secrets.VITE_KLIPY_API_KEY }}
        uses: ./.github/actions/dagger
        with:
          module: ops
          key: ops-desktop-release
          volumes: rocksky-desktop-cargo-registry,rocksky-desktop-cargo-git,rocksky-desktop-bun,rocksky-desktop-tauri,rocksky-desktop-release-amd64
          command: |
            dagger api call -m ops desktop-release --source .. --version "$VERSION" --klipy-key env://KLIPY_API_KEY --output "$RUNNER_TEMP/desktop-assets"

      - name: Upload to release
        if: runner.os != 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.prepare-release.outputs.tag }}" Rocksky_* --clobber

      - name: Upload Linux desktop bundles (PureScript Dagger)
        if: runner.os == 'Linux'
        working-directory: .dagger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: dagger api call -m ops upload-release --assets "$RUNNER_TEMP/desktop-assets" --tag "$RELEASE_TAG" --token env://GH_TOKEN --run-id "$RELEASE_RUN"
