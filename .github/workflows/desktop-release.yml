name: desktop-release
'on':
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (default desktop-v<version> from desktop/src-tauri/tauri.conf.json)
        type: string
        required: false
      linux_only:
        description: Rebuild only Linux assets (preserve published macOS checksums)
        type: boolean
        default: false
  push:
    tags:
    - desktop-v*
permissions:
  contents: write
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fluentci-modules:
    permissions:
      contents: read
    uses: ./.github/workflows/fluentci-modules.yml
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up FluentCI
      uses: ./.github/actions/setup-fluentci
    - name: Resolve release tag
      id: tag
      env:
        RELEASE_INPUT_TAG: ${{ inputs.tag }}
      uses: ./.github/actions/fluentci
      with:
        module: host
        function: resolveTag
        arguments: '{"project":"desktop"}'
    - name: Ensure release exists (PureScript FluentCI)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        RELEASE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
      uses: ./.github/actions/fluentci
      with:
        module: ops
        function: ensureRelease
        arguments: '{"project":"desktop","tag":"$RELEASE_TAG","commit":"$GITHUB_SHA","token":"env://GH_TOKEN","runId":"$RELEASE_RUN"}'
    needs:
    - fluentci-modules
  build:
    needs:
    - fluentci-modules
    - prepare-release
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.linux_only && '[{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-24.04","bundles":"deb,rpm,appimage"}]'
          || '[{"target":"aarch64-apple-darwin","os":"macos-latest","bundles":"app"},{"target":"x86_64-apple-darwin","os":"macos-latest","bundles":"app"},{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-24.04","bundles":"deb,rpm,appimage"}]')
          }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up FluentCI
      uses: ./.github/actions/setup-fluentci
    - name: Set up Bun through FluentCI
      if: runner.os != 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        fluentci run setup-bun@v0.2.0 setup --version 1.4.3 | python3 .github/scripts/export-setup-env.py
    - uses: dtolnay/rust-toolchain@stable
      if: runner.os != 'Linux'
      with:
        targets: ${{ matrix.target }}
    - uses: Swatinem/rust-cache@v2
      if: runner.os != 'Linux'
      with:
        workspaces: desktop/src-tauri
        shared-key: desktop-${{ matrix.target }}
        cache-on-failure: true
    - name: Prepare desktop workspace with FluentCI
      if: runner.os != 'Linux'
      uses: ./.github/actions/fluentci
      with:
        module: host
        function: prepareDesktop
        arguments: '{}'
    - name: Stamp version from tag
      if: runner.os != 'Linux'
      env:
        VERSION: ${{ needs.prepare-release.outputs.version }}
      uses: ./.github/actions/fluentci
      with:
        module: host
        function: stampDesktop
        arguments: '{}'
    - name: tauri build
      if: runner.os != 'Linux'
      env:
        APPLE_SIGNING_IDENTITY: '-'
        KLIPY_API_KEY: ${{ secrets.VITE_KLIPY_API_KEY }}
        RELEASE_TARGET: ${{ matrix.target }}
        RELEASE_BUNDLES: ${{ matrix.bundles }}
      uses: ./.github/actions/fluentci
      with:
        module: host
        function: buildDesktop
        arguments: '{}'
    - name: Package macOS bundle (ad-hoc signed)
      if: runner.os == 'macOS'
      env:
        VERSION: ${{ needs.prepare-release.outputs.version }}
        RELEASE_TARGET: ${{ matrix.target }}
      uses: ./.github/actions/fluentci
      with:
        module: host
        function: packageDesktop
        arguments: '{}'
    - name: Build and verify Linux desktop bundles (PureScript FluentCI)
      if: runner.os == 'Linux'
      env:
        VERSION: ${{ needs.prepare-release.outputs.version }}
        KLIPY_API_KEY: ${{ secrets.VITE_KLIPY_API_KEY }}
      uses: ./.github/actions/fluentci
      with:
        module: ops
        function: desktopRelease
        arguments: '{"source":".","version":"$VERSION","klipyKey":"env://KLIPY_API_KEY","output":"$RUNNER_TEMP/desktop-assets"}'
    - name: Upload to release
      if: runner.os != 'Linux'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
      uses: ./.github/actions/fluentci
      with:
        module: host
        function: upload
        arguments: '{"directory":"desktop","prefix":"Rocksky_"}'
    - name: Upload Linux desktop bundles (PureScript FluentCI)
      if: runner.os == 'Linux'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        RELEASE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
      uses: ./.github/actions/fluentci
      with:
        module: github-release
        function: upload
        arguments: '{"repository":"$GITHUB_REPOSITORY","clobber":true,"assets":"$RUNNER_TEMP/desktop-assets","tag":"$RELEASE_TAG","token":"env://GH_TOKEN","runId":"$RELEASE_RUN"}'
