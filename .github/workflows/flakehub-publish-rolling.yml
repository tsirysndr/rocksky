name: Publish every Git push to main to FlakeHub
'on':
  push:
    branches:
    - main
jobs:
  fluentci-modules:
    permissions:
      contents: read
    uses: ./.github/workflows/fluentci-modules.yml
  flakehub-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Set up FluentCI
      uses: ./.github/actions/setup-fluentci
    - uses: DeterminateSystems/determinate-nix-action@v3
    - name: Publish rolling flake through FluentCI
      env:
        GH_TOKEN: ${{ github.token }}
      uses: ./.github/actions/fluentci
      with:
        module: host
        function: flakehubPublish
        arguments: '{}'
    needs:
    - fluentci-modules
