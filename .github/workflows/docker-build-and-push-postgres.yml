name: Build and Push Postgres Docker Image

on:
  push:
    branches:
      - main
    paths:
      - "crates/xataid-extension/**"
      - ".dagger/**"
      - "dagger.toml"
      - "dagger.lock"
      - ".github/workflows/docker-build-and-push-postgres.yml"

env:
  DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

jobs:
  build-and-push:
    # Publishing is disabled until explicitly re-enabled.
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: .dagger
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Dagger CLI
        uses: ./.github/actions/setup-dagger
      - name: Build and publish both PostgreSQL architectures (PureScript Dagger)
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dagger --progress plain -v api call -m ops publish-postgres --source ../crates/xataid-extension \
            --docker-user "$DOCKER_USER" --docker-password env://DOCKER_PASSWORD \
            --github-user "$GH_USER" --github-token env://GH_TOKEN
