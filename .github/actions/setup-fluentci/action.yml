name: Set up FluentCI
description: Set up FluentCI with the official action and download or build the PureScript Wasm modules.
inputs:
  build-tools:
    description: Install the PureScript compiler toolchain instead of downloading compiled modules.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Set up FluentCI
      if: runner.os != 'Windows'
      uses: fluentci-io/setup-fluentci@next
    - name: Set up Node.js through FluentCI
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        fluentci run setup-node@v0.2.0 setup --version 24.22.2 | python3 .github/scripts/export-setup-env.py
    - name: Set up WSL for the Windows native build
      if: runner.os == 'Windows'
      uses: Vampire/setup-wsl@v7
      with:
        distribution: Ubuntu-24.04
        additional-packages: curl ca-certificates
    - name: Install FluentCI with curl in WSL
      if: runner.os == 'Windows'
      shell: wsl-bash {0}
      run: |
        sh .github/scripts/install-fluentci.sh
        "$HOME/.local/bin/fluentci" --version
    - name: Set up Node.js through FluentCI in WSL
      if: runner.os == 'Windows'
      shell: wsl-bash {0}
      run: |
        set -eu
        "$HOME/.local/bin/fluentci" run setup-node@v0.2.0 setup --version 24.22.2
    - name: Install pinned PureScript build tools
      if: inputs.build-tools == 'true'
      shell: bash
      working-directory: .
      run: |
        set -euo pipefail
        fluentci run setup-purescript@v0.2.0 setup --version 0.15.16 --spago-version 1.0.5 --node-version 24.22.2 --bun-version 1.4.3 | python3 .github/scripts/export-setup-env.py
    - name: Install Extism JavaScript compiler
      if: inputs.build-tools == 'true'
      shell: bash
      working-directory: ${{ runner.temp }}
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        curl -fsSL https://raw.githubusercontent.com/extism/js-pdk/v1.7.0/install.sh | bash -s -- v1.7.0
        extism-js --version
    - name: Download compiled FluentCI modules
      if: inputs.build-tools != 'true'
      uses: actions/download-artifact@v4
      with:
        name: fluentci-modules
        path: .fluentci
