name: PureScript CI tools
description: Compile runner-side PureScript and optionally install the verified Dagger CLI.
inputs:
  install-dagger:
    description: Install the pinned Dagger CLI after compiling the PureScript runner.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Set up FluentCI
      uses: fluentci-io/setup-fluentci@next
    - name: Set up Node.js through FluentCI
      shell: bash
      run: |
        set -euo pipefail
        fluentci run setup-node@v0.2.0 setup --version 24.22.2 | python3 .github/scripts/export-setup-env.py
    - name: Compile runner-side PureScript
      shell: bash
      working-directory: .dagger/host
      run: |
        npm ci --no-audit --no-fund
        npm run build
        npm test
    - name: Install verified Dagger CLI
      if: inputs.install-dagger == 'true'
      shell: bash
      working-directory: .
      run: node .dagger/host/run.mjs install-dagger
